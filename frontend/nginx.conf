server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: unknown paths (deep links, reloads) get index.html instead of a 404.
  location / {
    try_files $uri /index.html;
  }

  # Vite emits content-hashed file names under /assets, so they can be cached "forever":
  # a new build changes the name.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html is the entry that points at the hashed files, so it must always be revalidated
  # or users would keep loading an old bundle after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
